name: Publish Conda packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Namespaced prefix.dev channel
        required: true
        default: andmai/science
      full-matrix:
        description: Build every platform, even for a pre-release tag
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PREFIX_CHANNEL: ${{ inputs.channel || 'andmai/science' }}

jobs:
  # Pre-release tags (v1.2.0.dev2, v1.3.0rc1, ...) build linux-64 only; final
  # tags additionally build linux-aarch64 and osx-arm64.
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      # Emit whole {runner, target} objects rather than a bare runner list with a
      # static `include:`. An `include:` entry whose value conflicts with a matrix
      # key cannot be merged into any combination, so Actions appends it as a new
      # job carrying only that entry's keys -- which is how a linux-64-only
      # pre-release still spawned aarch64 and macOS jobs, each with an empty
      # python-version.
      - id: pick
        env:
          FULL: ${{ inputs.full-matrix }}
          REF: ${{ github.ref_name }}
        run: |
          linux64='{"runner":"ubuntu-24.04","target":"linux-64"}'
          rest='{"runner":"ubuntu-24.04-arm","target":"linux-aarch64"},'
          rest="$rest"'{"runner":"macos-15","target":"osx-arm64"}'
          if [ "$FULL" = "true" ] || { [ "${{ github.event_name }}" = "push" ] \
              && ! printf '%s' "$REF" | grep -Eqi 'dev|rc|[ab][0-9]+$'; }; then
            echo "platforms=[$linux64,$rest]" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=[$linux64]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform.target }} packages
    needs: resolve-matrix
    runs-on: ${{ matrix.platform.runner }}
    # Both `pixi publish` (build environment) and `pixi exec` (test environment)
    # resolve conda packages from scratch on a clean runner. Point them at one
    # cacheable directory so that download work is done once per recipe change
    # rather than once per job. setup-pixi's own `cache:` option is not the right
    # tool here: it keys off a lockfile this repo does not track, and it caches
    # the workspace environment, which has no dependencies at all.
    env:
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi-pkg-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform: ${{ fromJSON(needs.resolve-matrix.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache downloaded conda packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: >-
            pixi-pkgs-${{ matrix.platform.target }}-py${{ matrix.python-version
            }}-${{ hashFiles('recipe/recipe.yaml', 'pyproject.toml') }}
          restore-keys: |
            pixi-pkgs-${{ matrix.platform.target }}-py${{ matrix.python-version }}-

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest

      - name: Read package version
        run: echo "QMEQ_PACKAGE_VERSION=$(python scripts/qmeq_version.py)" >> "$GITHUB_ENV"

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$QMEQ_PACKAGE_VERSION"

      - name: Build and test the Conda packages
        run: >-
          pixi publish
          --clean
          --path recipe/recipe.yaml
          --variant "python=${{ matrix.python-version }}"
          --target-platform "${{ matrix.platform.target }}"
          --target-dir "${{ runner.temp }}/qmeq-conda"
          --build-dir "${{ runner.temp }}/qmeq-pixi-build"

      - name: Test the installed Conda package
        working-directory: ${{ runner.temp }}
        env:
          QMEQ_BACKEND: cython
        run: >-
          pixi exec
          --force-reinstall
          --spec "${{ runner.temp }}"/qmeq-conda/*.conda
          --spec pytest
          --spec matplotlib
          --spec nbclient
          --spec ipykernel
          pytest --pyargs qmeq

      - name: Save the tested Conda packages
        uses: actions/upload-artifact@v7
        with:
          name: qmeq-conda-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/qmeq-conda/*.conda

  publish:
    name: Publish tested packages
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          run-install: false
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_API_KEY }}

      - name: Download the tested Conda packages
        uses: actions/download-artifact@v8
        with:
          pattern: qmeq-conda-*
          path: ${{ runner.temp }}/qmeq-conda
          merge-multiple: true

      - name: Upload the Conda packages to prefix.dev
        run: >-
          pixi upload prefix
          --channel "$PREFIX_CHANNEL"
          --skip-existing
          "${{ runner.temp }}"/qmeq-conda/*.conda
