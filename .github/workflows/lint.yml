name: Lint

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.15.22"

      - name: Check Python sources and notebooks
        run: ruff check --output-format=github .
