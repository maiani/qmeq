name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  python:
    name: Pure Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version advertised in pyproject.toml's classifiers, so the
        # declared support range is actually exercised. This is the cheap job,
        # which is why the version sweep lives here rather than on the compiled
        # matrix below.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Build isolation is left on here, unlike the cython job below: this
        # job builds no extensions, so it has no preinstalled Cython version
        # that needs to survive into the build environment, and setup.py
        # imports numpy unconditionally.
        run: QMEQ_BACKEND=python python -m pip install -e ".[test]"

      - name: Confirm the pure-Python backend
        run: QMEQ_BACKEND=python python -c "import qmeq; status = qmeq.get_backend_status(); print(status); assert status['active'] == 'python'"

      - name: Run the pure-Python test suite
        run: QMEQ_BACKEND=python pytest qmeq/tests

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pandoc
        # nbsphinx shells out to pandoc; it is not a Python dependency.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install the docs dependencies
        run: QMEQ_BACKEND=python python -m pip install -e ".[docs]"

      - name: Build the documentation with warnings as errors
        working-directory: docs
        run: QMEQ_BACKEND=python sphinx-build -b html -W --keep-going source build/html

  cython:
    name: Cython ${{ matrix.cython }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell, which does not understand the
        # `VAR=value command` prefix used throughout these steps.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # One leg per wheel toolchain (GCC, MSVC, Apple clang), so a change to
        # a .pyx or to the OpenMP configuration is exercised against all three
        # on every push instead of only when a release tag is built.
        os: [ubuntu-latest, windows-latest, macos-14]
        cython: [">=3,<4"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the selected Cython and test dependencies
        run: |
          # setuptools must be constrained to match [build-system] requires:
          # --no-build-isolation reuses whatever is already installed, and a
          # bare "pip install setuptools" is a no-op when an older one is
          # preinstalled -- which is the case on the macOS and Windows runners,
          # where it is too old to parse the PEP 639 license metadata.
          python -m pip install "cython${{ matrix.cython }}" numpy "setuptools>=77"
          QMEQ_BACKEND=python python -m pip install -e ".[test]" --no-build-isolation

      - name: Regenerate and build all extensions
        # QMEQ_OPENMP is left at its default here so that a toolchain without a
        # usable OpenMP runtime (Apple clang) still builds; the chosen flags are
        # printed by setup.py, and the wheel build sets QMEQ_OPENMP=on where
        # OpenMP is required.
        run: QMEQ_BACKEND=cython python setup.py build_ext --inplace

      - name: Confirm the compiled backend
        run: QMEQ_BACKEND=cython python -c "import qmeq; status = qmeq.get_backend_status(); print(status); assert status['active'] == 'cython'"

      - name: Run the compiled test suite
        run: QMEQ_BACKEND=cython pytest qmeq/tests
