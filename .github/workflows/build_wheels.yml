# Wheels and the source distribution, built and verified on a tag, then
# attached to the release. The file name stays `build_wheels.yml` so that the
# existing run history, any branch protection referring to it, and the
# references to it from other workflows and documents keep resolving.
name: Build release artifacts

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        # Same guard as release.yml. Without it a tag whose name disagrees with
        # qmeq.__version__ still builds, and the publish job below attaches
        # wheels carrying the *package* version to a release named after the
        # *tag* -- mismatched artifacts, published silently.
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version=$(python scripts/qmeq_version.py)
          tag_version=${GITHUB_REF_NAME#v}
          echo "tag=$tag_version package=$package_version"
          test "$tag_version" = "$package_version"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # macOS wheels are built serially, on purpose. Apple clang has no
          # OpenMP runtime of its own, and the alternatives all bundle one that
          # is built for the *runner's* macOS version: doing that forced the
          # wheel's deployment target up to match (delocate-wheel refuses to
          # repair it otherwise), which produced macosx_15_0 Intel wheels that
          # most Intel Macs cannot install. A serial build keeps the compiled
          # kernels and stays installable on older macOS; `prange` lowers to an
          # ordinary loop and results are unchanged to roundoff. Threaded macOS
          # builds are available from the Conda packages or by building from
          # source with QMEQ_OPENMP=on and a libomp installed.
          CIBW_ENVIRONMENT_MACOS: "QMEQ_OPENMP=off"
          # Linux and Windows get OpenMP; make its absence a build failure
          # rather than a silent downgrade to a serial wheel.
          CIBW_ENVIRONMENT_LINUX: "QMEQ_OPENMP=on"
          CIBW_ENVIRONMENT_WINDOWS: "QMEQ_OPENMP=on"
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_TEST_REQUIRES: pytest
          # Assert the compiled backend before running the suite. The suite
          # alone cannot tell a working wheel from one that fell back to pure
          # Python, because CIBW_TEST_COMMAND runs with QMEQ_BACKEND unset and
          # 'auto' falls back quietly when the extensions are absent.
          CIBW_TEST_COMMAND: >
            python {project}/.github/scripts/check_wheel_backend.py &&
            python {project}/.github/scripts/check_installed_metadata.py &&
            pytest --pyargs qmeq

      - name: Check the inventory of the wheels that ship
        # cibuildwheel's test command runs against the *installed* package and
        # cannot see what the wheel ships; artifacts.yml inventories a locally
        # built wheel, which is not the artifact users download from a release.
        shell: bash
        run: python .github/scripts/check_artifact_inventory.py --expect wheel ./wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Build the source distribution
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version
        # Same guard as the wheel job: a release must not carry an sdist whose
        # version disagrees with the tag it is attached to.
        if: github.event_name == 'push'
        run: |
          package_version=$(python scripts/qmeq_version.py)
          tag_version=${GITHUB_REF_NAME#v}
          echo "tag=$tag_version package=$package_version"
          test "$tag_version" = "$package_version"

      - name: Build and validate the source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*.tar.gz
          python .github/scripts/check_artifact_inventory.py --expect sdist dist

      - name: Install it outside the checkout and confirm the compiled backend
        # The sdist is what `pip install` compiles from source, so the copy
        # that ships has to build its extensions on a clean machine, not only
        # in the tree it was cut from. artifacts.yml runs the full installed
        # suite; this is the release-time smoke test of the same artifact.
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv qmeq-sdist
          qmeq-sdist/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          QMEQ_BACKEND=cython qmeq-sdist/bin/python -c "import qmeq; status = qmeq.get_backend_status(); print(status); assert status['active'] == 'cython'"
          qmeq-sdist/bin/python "$GITHUB_WORKSPACE"/.github/scripts/check_installed_metadata.py

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish the wheels and the sdist to the release
    needs: [build, sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download the built wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: release-assets
          merge-multiple: true

      - name: Download the source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: release-assets

      - name: Upload the release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-assets/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
