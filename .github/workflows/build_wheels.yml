name: Build wheels

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Determine the macOS deployment target
        if: runner.os == 'macOS'
        # Homebrew's GCC bundles an OpenMP runtime (libgomp) built for the
        # host's own macOS version, so the wheel's deployment target must be
        # raised to match it (delocate-wheel otherwise refuses to repair the
        # wheel); derive it from the host rather than hardcoding a version
        # that will drift on the next runner-image bump. Computed as a
        # regular step, with GitHub Actions substituting the value via
        # ${{ }} below, rather than inside CIBW_ENVIRONMENT_MACOS: that
        # variable is evaluated by cibuildwheel's own restricted shell-subset
        # parser, which rejects a pipe inside $(...), and is evaluated to
        # build CIBW_BEFORE_ALL_MACOS's own environment before that script
        # has even run, so it cannot depend on anything the script produces.
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BEFORE_ALL_MACOS: bash scripts/cibw_before_all_macos.sh
          # Apple clang rejects -fopenmp; cibw_before_all_macos.sh symlinks the
          # Homebrew GCC it finds as plain "gcc" on PATH, but the build step
          # runs in its own subprocess and still defaults to clang unless CC
          # is set explicitly here.
          CIBW_ENVIRONMENT_MACOS: "CC=gcc MACOSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }}"
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs qmeq

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish wheels to the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download the built wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: wheelhouse/*.whl
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
