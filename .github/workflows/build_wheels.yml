name: Build wheels

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        # Same guard as release.yml. Without it a tag whose name disagrees with
        # qmeq.__version__ still builds, and the publish job below attaches
        # wheels carrying the *package* version to a release named after the
        # *tag* -- mismatched artifacts, published silently.
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version=$(python scripts/qmeq_version.py)
          tag_version=${GITHUB_REF_NAME#v}
          echo "tag=$tag_version package=$package_version"
          test "$tag_version" = "$package_version"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # macOS wheels are built serially, on purpose. Apple clang has no
          # OpenMP runtime of its own, and the alternatives all bundle one that
          # is built for the *runner's* macOS version: doing that forced the
          # wheel's deployment target up to match (delocate-wheel refuses to
          # repair it otherwise), which produced macosx_15_0 Intel wheels that
          # most Intel Macs cannot install. A serial build keeps the compiled
          # kernels and stays installable on older macOS; `prange` lowers to an
          # ordinary loop and results are unchanged to roundoff. Threaded macOS
          # builds are available from the Conda packages or by building from
          # source with QMEQ_OPENMP=on and a libomp installed.
          CIBW_ENVIRONMENT_MACOS: "QMEQ_OPENMP=off"
          # Linux and Windows get OpenMP; make its absence a build failure
          # rather than a silent downgrade to a serial wheel.
          CIBW_ENVIRONMENT_LINUX: "QMEQ_OPENMP=on"
          CIBW_ENVIRONMENT_WINDOWS: "QMEQ_OPENMP=on"
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs qmeq

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish wheels to the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download the built wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: wheelhouse/*.whl
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
