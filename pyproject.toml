[build-system]
requires = [
    "setuptools>=77",
    "cython>=3.0,<4",
    "numpy",
    "scipy",
]
build-backend = "setuptools.build_meta"

[project]
name = "qmeq"
dynamic = ["version"]
description = "Package for transport calculations in quantum dots using approximate quantum master equations"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]
authors = [
    {name = "Gediminas Kirsanskas", email = "qmeq.package@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "matplotlib",
    "nbclient",
    "ipykernel",
    "setuptools>=77",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # API reference generated from the source docstrings.
    "mkdocstrings[python]>=0.26",
    # Renders the tutorial notebooks.
    "mkdocs-jupyter>=0.25",
]
dev = [
    "qmeq[test,docs]",
    "ruff",
    "cython>=3.0,<4",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/gedaskir/qmeq"
Source = "https://github.com/gedaskir/qmeq"
Documentation = "https://github.com/gedaskir/qmeq/tree/master/docs"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "qmeq.__version__"}

[tool.setuptools.packages.find]
include = ["qmeq*"]

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd"]
"qmeq.tests" = ["data/*/*.json", "data/*/*.npz"]

[tool.pytest]
minversion = "9.0"
testpaths = ["qmeq/tests"]
addopts = ["-m", "not notebook"]
strict = true
markers = [
    "example: executable vendored example scripts and notebooks",
    "notebook: notebook execution requiring a Jupyter kernel and local sockets",
    "slow: long-running example tests, skipped unless --runslow is given",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly so a new Ruff default does not
# change the gate.
select = ["E4", "E7", "E9", "F"]
# E741 (ambiguous names): `l` is the lead index throughout QmeQ, as in the
# Cython twins Ruff does not lint, and renaming it on the Python side alone
# would break their line-for-line correspondence; `I` and `O` are physics
# notation in tests and notebooks.
ignore = ["E741"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
